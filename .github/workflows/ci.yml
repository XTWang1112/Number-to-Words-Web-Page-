name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NumberToWordsWebPage.sln

      - name: Build
        run: dotnet build NumberToWordsWebPage.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test NumberToWordsWebPage.sln --no-build --configuration Release