<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number to Words</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-container">
        <section class="converter-container">
            <header class="converter-header">
                <h1>Number to Words Converter</h1>
                <p>Enter the amount you want to convert into words</p>
            </header>
            <form id="converter-form" novalidate>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="input-wrapper">
                        <span class="dollar-symbol">$</span>
                        <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="123.45" aria-describedby="amount-help amount-error" />
                    </div>
                    <p id="amount-help" class="message-text">Enter a value with up to two decimal places.</p>
                    <p id="amount-error" class="error-text"></p>
                </div>
                <button id="convert-button" type="submit">Convert</button>
            </form>
            <section id="result-section" class="result-section" aria-labelledby="result-heading" aria-live="polite" hidden>
                <div class="result-header">
                    <h2>Result</h2>
                    <button id="copy-button" class="copy-button" type="button" aria-label="Copy result to clipboard">Copy</button>
                </div>
                <p id="result" class="result-text"></p>
                <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
            </section>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
